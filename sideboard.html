<div id="__describeImageSideboard" class="sideboard-show">
    <button type="button" id="__sideboardHideBtn">Hide</button>

    <div class="sideboard-header">
        Option + C to hide/show, Option + V to expand/collapse, Option + B to enlarge image
        <input
            type="text"
            id="promt-content"
            placeholder="Add text to guide the description..."
            value="Describe what you see in the image like casual conversation in 50 words."
        />
    </div>

    <img id="__describeImageSideboardImg"/>

    <div id="__describeImageSideboardMeta"></div>

    <button type="button" id="__sideboardCaptureBtn">Capture</button>

    <section class="sideboard-chat" aria-label="Image chat">
        <div class="sideboard-chat-title">Chat</div>
        <div id="__describeImageSideboardText" class="sideboard-chat-messages" role="log"></div>

        <div class="sideboard-chat-compose">
            <div class="sideboard-compose-main">
                <label class="sideboard-compose-label" for="__sideboardChatInput">Your message</label>

                <div
                    id="correction-version"
                    class="sideboard-correction"
                    hidden
                    role="region"
                    aria-label="Grammar suggestion"
                >
                    <div class="sideboard-correction-header">
                        <div
                        id="__sideboardGrammarStatus"
                        class="sideboard-grammar-status"
                        hidden
                        aria-live="polite"
                    >
                        <span class="sideboard-grammar-spinner" aria-hidden="true"></span>
                        <span class="sideboard-grammar-status-text">Checking grammar…</span>
                    </div>
                    
                        <span class="sideboard-correction-badge">Grammar</span>
                        <button
                            type="button"
                            id="__sideboardApplyCorrection"
                            class="sideboard-correction-apply"
                            hidden
                        >
                            Use suggestion
                        </button>
                    </div>
                    <div class="sideboard-correction-text" style="max-height: 200px; overflow-y: auto;"></div>
              
                    
                </div>

                <div class="sideboard-input-shell">
                    <textarea
                        id="__sideboardChatInput"
                        class="sideboard-chat-input"
                        rows="1"
                        placeholder="Ask about the image…"
                        aria-describedby="correction-version"
                    ></textarea>
                    
                </div>

                
            </div>

            <button
                type="button"
                id="__sideboardChatSend"
                class="sideboard-chat-send"
                title="Send (Enter)"
            >
                Send
            </button>
        </div>
    </section>
</div>

<button type="button" id="__sideboardShowBtn" class="sideboardShowBtn-hidden">Show Panel</button>
