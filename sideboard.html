<div id="__describeImageSideboard" class="sideboard-show">
    <button type="button" id="__sideboardHideBtn">Hide</button>

    <div class="sideboard-header">
        Option + C to hide/show, Option + V to expand/collapse, Option + B to enlarge image
        <input
            type="text"
            id="promt-content"
            placeholder="Add text to guide the description..."
            value="Describe what you see in the image like casual conversation in 50 words."
        />
    </div>

    <img id="__describeImageSideboardImg" alt="Cropped capture preview" />

    <div id="__describeImageSideboardMeta"></div>

    <div class="sideboard-text-title">Accumulated text</div>

    <button type="button" id="__sideboardCaptureBtn">Capture</button>

    <pre id="__describeImageSideboardText"></pre>
</div>

<button type="button" id="__sideboardShowBtn" class="sideboardShowBtn-hidden">Show Panel</button>
